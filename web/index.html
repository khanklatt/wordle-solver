<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Wordle Solver</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>Wordle Solver</h1>
            <button id="reset-btn" class="reset-btn">New Game</button>
        </header>
        
        <main class="game-container">
            <div class="game-board-container">
                <div id="game-board" class="game-board" role="grid" aria-label="Wordle game board">
                    <!-- Game board will be generated by JavaScript -->
                </div>
                
                <div class="input-section">
                    <input 
                        type="text" 
                        id="word-input" 
                        class="word-input" 
                        maxlength="5" 
                        autocomplete="off"
                        autocapitalize="characters"
                        autofocus
                        aria-label="Enter your guess"
                        placeholder="Type your guess..."
                    >
                    <button id="submit-btn" class="submit-btn" disabled>Enter</button>
                </div>
                
                <div id="message" class="message" role="alert"></div>
            </div>
            
            <aside class="suggestions-sidebar">
                <h2>Suggestions</h2>
                <div id="suggestions-list" class="suggestions-list" role="list">
                    <!-- Suggestions will be populated by JavaScript -->
                </div>
            </aside>
        </main>
    </div>
    
    <script src="js/api.js"></script>
    <script src="js/constraint-state.js"></script>
    <script src="js/game-board.js"></script>
    <script src="js/suggestions.js"></script>
    <script src="js/app.js"></script>
</body>
</html>
